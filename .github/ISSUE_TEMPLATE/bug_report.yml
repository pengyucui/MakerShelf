name: Bug 报告
description: 报告可重复出现的错误或异常行为
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请勿提交 Cookie、令牌、邮箱、账号或私人模型文件。
  - type: input
    id: version
    attributes:
      label: MakerShelf 版本
      placeholder: 例如 1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 与 Mac 型号
      placeholder: 例如 macOS 15.6，MacBook Pro M3
    validations:
      required: true
  - type: dropdown
    id: site
    attributes:
      label: 相关来源
      options:
        - MakerWorld 中文站
        - MakerWorld 国际站
        - 本地模型
        - 与站点无关
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出最少且完整的操作步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏错误信息
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除账号、Cookie、令牌、本地路径和私人模型信息
          required: true
