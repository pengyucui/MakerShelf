name: 功能建议
description: 提议新的使用场景或体验改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 说明谁在什么情况下遇到了什么问题。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 描述希望看到的最终行为。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: boundaries
    attributes:
      label: 功能边界
      options:
        - label: 该建议不要求绕过付费、积分、地区、版权或访问控制
          required: true
