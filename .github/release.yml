changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: 新功能
      labels:
        - enhancement
        - feature
    - title: 问题修复
      labels:
        - bug
        - fix
    - title: 文档与维护
      labels:
        - documentation
        - maintenance
    - title: 其他改动
      labels:
        - "*"
