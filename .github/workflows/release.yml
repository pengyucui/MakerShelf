name: 发布 macOS 版本

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 构建并发布
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v7.0.1

      - name: 校验发布说明
        shell: bash
        run: |
          set -euo pipefail
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -s "${notes}" ]]; then
            echo "缺少 Release 说明：${notes}"
            exit 1
          fi

      - name: 构建并打包 Release App
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package.sh --version "${GITHUB_REF_NAME#v}" --output dist

      - name: 保存 Action 构建产物
        uses: actions/upload-artifact@v7.0.1
        with:
          name: MakerShelf-${{ github.ref_name }}-unsigned-macOS
          path: |
            dist/MakerShelf-*-unsigned-macOS.zip
            dist/MakerShelf-*-unsigned-macOS.zip.sha256
          if-no-files-found: error

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="dist/MakerShelf-${version}-unsigned-macOS.zip"
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${package}" "${package}.sha256" --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "MakerShelf ${version}" --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${package}" \
              "${package}.sha256" \
              --verify-tag \
              --title "MakerShelf ${version}" \
              --notes-file "${notes}"
          fi
